packages: []

# esbuild drives vitest's transform pipeline; its install script is required.
allowBuilds:
  esbuild: true

# The plugin is a single package; this file exists so pnpm resolves the project
# root deterministically and does not walk up into an unrelated parent
# workspace.
#
# `@deepseek-ai/*` DSH contracts are ordinary `devDependencies` pinned to one
# exact release, so a fresh clone reaches a working contract environment with
# `pnpm install` alone: nothing outside this directory is read or written.
# `autoInstallPeers` stays off because installing `@deepseek-ai/cordis` as an
# auto-installed peer would create a second Cordis program, and the DSH client
# packages declare their contract by augmenting Cordis's `Context` interface —
# two copies means the augmentations land on a `Context` this plugin never sees.
# `@deepseek-ai/cordis` is therefore an explicit devDependency and a peer.
autoInstallPeers: false
