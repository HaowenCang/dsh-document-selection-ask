# Cordis patch for `dsh-document-selection-ask`.
#
# One row inserts the package itself. The row is a bare plugin by package name:
# the host half (`exports "."`) runs in the host process, and the `dsh.client`
# declaration in `package.json` makes the browser half (`exports "./client"`,
# served as the plugin's `client.js`) load in the web GUI and call
# `applyClient(ctx)` on the client context.
#
# That browser half is the whole activation surface today, and this patch is
# still one insert row of one entry. On the client context `applyClient`
# registers four extension renderers — PDF, DOCX, PPTX and XLSX — through the
# public `ctx.documentPreviews.register` service. The builtin TXT, Markdown,
# code and CSV previews are not replaced: this plugin registers only the four
# formats DSH's own preview service does not render. The Ask surface is
# contributed through the `shell.overlay` slot and the composer target through
# the `conversation.input.overlay` slot; none of those registrations is a patch
# entry, and disabling the plugin disposes them and leaves the builtin previews
# intact.
- insert:
    - id: document-selection-ask
      name: 'dsh-document-selection-ask'
